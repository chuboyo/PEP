services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pep}
      POSTGRES_DB: ${POSTGRES_DB:-pep}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pep} -d ${POSTGRES_DB:-pep}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pep:pep@db:5432/pep}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://pep:pep@db:5432/pep_test}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@example.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SEED_SUPERADMIN_ON_STARTUP: ${SEED_SUPERADMIN_ON_STARTUP:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - ./apps/api/openapi.json:/api/openapi.json:ro
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  web_node_modules:
